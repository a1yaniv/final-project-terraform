# The pipeline (contracts P1-P11). Fill it in. Until it has on: and jobs:, GitHub shows it as an invalid workflow
name: Deploy Voting App

on:
  push:
    branches: [ main ]
    paths:
      - 'services/**'
      - 'infra/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'services/**'
      - 'infra/**'
      - '.github/workflows/**'

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # Job 1: Checks (P3)
  # -------------------------------------------------------------
  checks:
    name: Code Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infra/

      - name: Terraform Validate
        run: |
          cd infra
          terraform init -backend=false
          terraform validate

  # -------------------------------------------------------------
  # Job 2: Build & Push Docker Images (P4)
  # -------------------------------------------------------------
  build:
    name: Build & Push Images
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Images
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.sha }}
          PREFIX: ${{ vars.NAME_PREFIX }}
        run: |
          SERVICES=("vote" "result" "worker")
          
          for SERVICE in "${SERVICES[@]}"; do
            REPO="${PREFIX}-${SERVICE}"
            
            # Check if tag exists in ECR (P4)
            if aws ecr describe-images --repository-name "$REPO" --image-ids imageTag="$TAG" > /dev/null 2>&1; then
              echo "Image $REPO:$TAG already exists in ECR, skipping push."
            else
              echo "Building image for $SERVICE..."
              if [ "${{ github.event_name }}" == "push" ]; then
                docker buildx build --platform linux/amd64 -t "$REGISTRY/$REPO:$TAG" --push "./services/$SERVICE"
              else
                docker buildx build --platform linux/amd64 -t "$REGISTRY/$REPO:$TAG" "./services/$SERVICE"
              fi
            fi
          done

  # -------------------------------------------------------------
  # Job 3: Terraform Plan (PR only - P5)
  # -------------------------------------------------------------
  plan:
    name: Plan Dev & Prod
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Plan Dev
        run: |
          cd infra
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=voting-app/dev/terraform.tfstate" -backend-config="region=eu-north-1"
          terraform plan -var-file="envs/dev.tfvars" -var="name_prefix=${{ vars.NAME_PREFIX }}" -var="image_tag=${{ github.sha }}"

      - name: Plan Prod
        run: |
          cd infra
          rm -rf .terraform .terraform.lock.hcl
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=voting-app/prod/terraform.tfstate" -backend-config="region=eu-north-1"
          terraform plan -var-file="envs/prod.tfvars" -var="name_prefix=${{ vars.NAME_PREFIX }}" -var="image_tag=${{ github.sha }}"

  # -------------------------------------------------------------
  # Job 4: Deploy Dev (P6, P9, P10)
  # -------------------------------------------------------------
  deploy-dev:
    name: Deploy Dev
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Init & Apply
        run: |
          cd infra
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=voting-app/dev/terraform.tfstate" -backend-config="region=eu-north-1"
          terraform apply -auto-approve -var-file="envs/dev.tfvars" -var="name_prefix=${{ vars.NAME_PREFIX }}" -var="image_tag=${{ github.sha }}"

      - name: Smoke Test (P9)
        run: |
          cd infra
          VOTE_URL=$(terraform output -raw vote_url)
          RESULT_URL=$(terraform output -raw result_url)
          
          echo "Testing $VOTE_URL/healthz..."
          curl --fail --retry 5 --retry-delay 10 "$VOTE_URL/healthz"
          
          echo "Testing $RESULT_URL/healthz..."
          curl --fail --retry 5 --retry-delay 10 "$RESULT_URL/healthz"

      - name: Version Check (P10)
        run: |
          cd infra
          terraform plan -detailed-exitcode -var-file="envs/dev.tfvars" -var="name_prefix=${{ vars.NAME_PREFIX }}" -var="image_tag=${{ github.sha }}"

  # -------------------------------------------------------------
  # Job 5: Deploy Prod (P7, P8, P9, P10)
  # -------------------------------------------------------------
  deploy-prod:
    name: Deploy Prod
    needs: [build, deploy-dev]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Init & Apply
        run: |
          cd infra
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=voting-app/prod/terraform.tfstate" -backend-config="region=eu-north-1"
          terraform apply -auto-approve -var-file="envs/prod.tfvars" -var="name_prefix=${{ vars.NAME_PREFIX }}" -var="image_tag=${{ github.sha }}"

      - name: Smoke Test (P9)
        run: |
          cd infra
          VOTE_URL=$(terraform output -raw vote_url)
          RESULT_URL=$(terraform output -raw result_url)
          
          echo "Testing $VOTE_URL/healthz..."
          curl --fail --retry 5 --retry-delay 10 "$VOTE_URL/healthz"
          
          echo "Testing $RESULT_URL/healthz..."
          curl --fail --retry 5 --retry-delay 10 "$RESULT_URL/healthz"

      - name: Version Check (P10)
        run: |
          cd infra
          terraform plan -detailed-exitcode -var-file="envs/prod.tfvars" -var="name_prefix=${{ vars.NAME_PREFIX }}" -var="image_tag=${{ github.sha }}"